  sections:
    In breve:
      - Professionista del settore pubblico impegnato in iniziative di
        trasformazione digitale, governance dei dati e sviluppo dei sistemi
        informativi nel sistema sanitario regionale. Attualmente coinvolto in
        attività di coordinamento istituzionale, monitoraggio di progetti
        digitali complessi e analisi tecnico-normativa relative a sanità
        digitale, interoperabilità dei dati sanitari e sperimentazione di
        sistemi di intelligenza artificiale in ambito sanitario.
    Esperienza lavorativa:
      - company: Regione Piemonte
        position: Istruttore addetto ai servizi digitali - Sanità Digitale
        date:
        start_date: 2025-12
        end_date: present
        location: Torino
        summary: Supporto alla trasformazione digitale e alla governance dei sistemi
          informativi sanitari regionali, con attività di coordinamento
          istituzionale, monitoraggio di progetti e analisi tecnico-normativa.
        highlights:
          - supporto alla governance di iniziative di sanità digitale
          - monitoraggio dell’implementazione di sistemi informativi sanitari
          - analisi di documentazione tecnica e normativa relativa a
            interoperabilità dei dati sanitari
          - supporto alla sperimentazione di soluzioni di intelligenza
            artificiale in ambito sanitario
          - coordinamento tra strutture regionali, aziende sanitarie e fornitori
            tecnologici
      - company: Comune di Santa Vittoria d'Alba
        position: Agente di Polizia Locale e Staff Transizione Digitale
        start_date: 2021-08
        end_date: 2025-11
        location:
        summary: Attività svolta in un ente locale di piccole dimensioni, caratterizzato
          da strutture organizzative snelle e da una forte trasversalità
          operativa. Il ruolo ha combinato funzioni di polizia amministrativa e
          giudiziaria con responsabilità nella gestione di progetti di
          digitalizzazione e innovazione amministrativa.
        highlights:
          - svolgimento di attività di polizia amministrativa, polizia stradale
            e polizia giudiziaria, con gestione dei procedimenti sanzionatori e
            applicazione della normativa locale
          - rappresentanza dell’amministrazione comunale nei procedimenti
            relativi alle sanzioni amministrative e gestione dei rapporti con
            cittadini e operatori economici
          - supporto operativo in attività di protezione civile e gestione delle
            emergenze locali
          - coordinamento di progetti di trasformazione digitale finanziati dal
            PNRR, operando come punto di raccordo tra amministrazione e
            fornitori tecnologici
          - attivazione dei servizi di notifica digitale tramite piattaforma
            SEND e digitalizzazione del processo di gestione dei verbali del
            Codice della Strada
          - integrazione con la Piattaforma Digitale Nazionale Dati (PDND) per
            l’esposizione di API relative ai dati del Sportello Unico per
            l’Edilizia (SUE)
          - supporto ICT interno agli uffici comunali e digitalizzazione dei
            flussi amministrativi
      - company: Sicurtea s.r.l.
        position: Compliance e Processi Digitali
        start_date: 2019-08
        end_date: 2021-07
        location: Piobesi d'Alba
        summary: Collaborazione su attività di compliance normativa e sicurezza sul
          lavoro per clienti pubblici e privati, con integrazione di strumenti
          digitali a supporto dei processi di monitoraggio e gestione delle
          scadenze regolatorie.
        date:
        highlights:
          - supporto tecnico a sopralluoghi e attività di valutazione dei rischi
            in materia di salute e sicurezza sul lavoro
          - raccolta e analisi di dati tecnici a supporto della documentazione
            di conformità normativa
          - sviluppo del software gestionale open source DESU (Java) per il
            monitoraggio delle scadenze normative
          - supporto ai processi di audit e verifica documentale in contesti
            regolati
      - company: Lentalanga
        position: Gestore attività turistico-ricettiva
        start_date: "2012"
        end_date: 2019-11
        location: Diano d'Alba
        summary: Gestione operativa e amministrativa di un’attività ricettiva in
          contesto imprenditoriale familiare, con responsabilità su
          organizzazione, sostenibilità economica e introduzione di strumenti
          digitali.
        highlights:
          - gestione amministrativa e pianificazione finanziaria dell’attività
          - coordinamento delle attività operative e di manutenzione della
            struttura
          - sviluppo di iniziative di promozione e comunicazione digitale
          - gestione delle relazioni con clienti e stakeholder nazionali e
            internazionali
      - company: Sicurtea s.r.l.
        position: Tirocinio – Sicurezza sul lavoro
        start_date:
        end_date:
        location: Piobesi d'Alba
        date: Estate 2011
        summary: Esperienza di tirocinio formativo in attività di supporto ai processi
          di sicurezza sul lavoro e gestione della documentazione tecnica.
        highlights:
          - supporto alla redazione della documentazione relativa alla
            valutazione dei rischi (DVR)
          - partecipazione ad attività di audit e verifica della conformità
            normativa
          - raccolta e organizzazione dei dati tecnici necessari ai processi di
            sicurezza

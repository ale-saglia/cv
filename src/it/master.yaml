        start_date: 2021-08
        end_date: 2025-11
        location: Santa Vittoria d'Alba
        summary: Combinazione di iniziative di trasformazione digitale e
          funzioni di polizia amministrativa e giudiziaria all'interno di un
          ente locale di piccole dimensioni.
        highlights:
          - "**Operatività di prossimità e gestione del conflitto**: Esercizio
            di funzioni sanzionatorie e di intervento sul campo anche in situazione 
            di emergenza e gestione del conflitto interpersonale in contesti 
            di sicurezza pubblica ad alta pressione."
          - "**Change management digitale e scaling dei processi (PNRR)**:
            Direzione dell'implementazione del sistema cloud per la gestione verbali 
            propedeutico a SEND nel quadro PNRR, con scaling del volume operativo da 
            poche decine a oltre 200 atti annui a parità di organico."
          - "**Supporto IT e digitalizzazione degli uffici**: Erogazione di
            assistenza tecnica trasversale all'ente e modernizzazione delle
            attività di Polizia Locale tramite un workflow quasi paperless,
            con digitalizzazione di tutte le procedure interne e della
            modulistica."

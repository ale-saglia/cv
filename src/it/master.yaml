  sections:
    In breve:
      - Profilo ibrido giuridico-amministrativo e tecnico, attivo nel settore pubblico 
        su governance dei dati, interoperabilità e conformità normativa. Attualmente impegnato 
        nella sanità digitale regionale, con responsabilità di valutazione tecnica, coordinamento 
        istituzionale e monitoraggio PNRR. Esperienza pregressa nella trasformazione digitale di 
        un ente locale (PNRR–SEND) e nello sviluppo di strumenti open source per la compliance. 
        Interesse per le politiche digitali europee e i framework di interoperabilità tra livelli di governo.
    Esperienza lavorativa:
      - company: Regione Piemonte
        position: Istruttore addetto ai servizi digitali - Sanità Digitale
        date:
        start_date: 2025-12
        end_date: present
        location: Torino
        summary: Presidio trasversale, a supporto della dirigenza, di progetti di sanità
          digitale, dati e interoperabilità nel quadro del PNRR (Missione 6 - Salute).
          Attività a cavallo tra dimensione tecnica e normativa.
        highlights:
          - "**Coordinamento progetti di sanità digitale**: Coordinamento e
            monitoraggio di un portafoglio eterogeneo di iniziative di sanità
            digitale (interoperabilità dei dati, telemedicina, intelligenza
            artificiale in sanità), con tracciamento strutturato di stato
            avanzamento, stakeholder e dipendenze per ciascuna iniziativa, e
            raccordo con i soggetti chiave (CSI Piemonte, AGENAS, Aziende
            Sanitarie Regionali)."
          - "**Governance e controllo PNRR**: Partecipazione agli organismi di
            governance del PNRR – Missione 6 (Salute), tra cui cabine di regia e
            attività di verifica, con attenzione all'allineamento normativo e
            agli obiettivi di milestone."
          - "**Analisi, ricostruzione architetturale e redazione di atti**:
            Produzione di analisi, relazioni e ricostruzioni architetturali
            (mappatura dei processi as-is/to-be su sistemi complessi) a
            supporto delle decisioni della dirigenza, anche per tavoli di
            confronto inter-istituzionali e nazionali; redazione di atti
            amministrativi regionali (deliberazioni di Giunta, determinazioni
            dirigenziali, note e allegati tecnici) che integrano profili
            normativi, di data governance, protezione dei dati e architettura
            dei sistemi."
      - company: Comune di Santa Vittoria d'Alba
        position: Agente di Polizia Locale e Staff Transizione Digitale
        start_date: 2021-08
        end_date: 2025-11
        location: Santa Vittoria d'Alba
        summary: Funzioni di polizia locale in ente di piccole dimensioni, con 
          partecipazione parallela alle attività dell'ufficio Transizione Digitale.
        highlights:
          - "**Change management digitale e scaling dei processi (PNRR)**:
            Direzione dell'implementazione del sistema cloud per la gestione verbali 
            propedeutico a SEND nel quadro PNRR, con scaling del volume operativo da 
            poche decine a oltre 200 verbali annui a parità di organico."
          - "**Supporto IT e digitalizzazione degli uffici**: Erogazione di
            assistenza tecnica trasversale all'ente e modernizzazione delle
            attività di Polizia Locale tramite un workflow quasi paperless,
            con digitalizzazione di tutte le procedure interne e della
            modulistica."
          - "**Funzioni di polizia locale e accountability amministrativa**: Esercizio
            di funzioni sanzionatorie e di intervento sul campo anche in situazione 
            di emergenza e gestione del conflitto interpersonale in contesti 
            di sicurezza pubblica ad alta pressione."
      - company: Sicurtea s.r.l.
        position: Compliance e Sviluppo Digitale
        start_date: 2019-08
        end_date: 2021-07
        location: Piobesi d'Alba
        summary: Sviluppo di strumenti open source per la gestione della
          compliance e supporto ad audit normativi per clienti pubblici e
          privati.
        date:
        highlights:
          - "**Digitalizzazione di processo**: Sviluppo di
            [DESU](https://github.com/ale-saglia/desu), strumento open source
            per il tracciamento delle scadenze normative e il supporto agli
            audit, con data model su PostgreSQL e interfaccia desktop."
          - "**Compliance normativa**: Esecuzione di sopralluoghi e
            misurazioni tecniche a supporto della valutazione dei rischi e
            degli audit in materia di sicurezza sul lavoro in settori
            altamente regolati."
    Formazione:
      - institution: Università di Torino
        area: Scienze dell'Amministrazione Digitale
        degree: Laurea Triennale
        date:
        start_date: 2022-09
        end_date: 2026-06
        location:
        summary: Percorso di studi incentrato su diritto pubblico e amministrativo, 
          organizzazione della pubblica amministrazione, governance dei processi e trasformazione digitale.
        highlights:
          - "Tesi: Il dato nella transizione digitale della pubblica
            amministrazione (DOI: [10.5281/zenodo.21102766](https://doi.org/10.5281/zenodo.21102766))
            con focus su SPID, CIE, IT Wallet, PDND e App IO."
          - "Academic Minor: Diploma in Innovazione Digitale (DID) rilasciato
            dal Dipartimento di Giurisprudenza dell'Università di Torino.
            Percorso avanzato di formazione su innovazione digitale nella PA,
            governance dei dati e tecnologie emergenti."
      - institution: Università Guglielmo Marconi
        area: Ingegneria Informatica - Curriculum Intelligenza Artificiale
        degree: Laurea Triennale
        start_date: 2026-03
        end_date: present
        location:
        summary: Percorso orientato all'ingegneria informatica con curriculum AI, 
          costruito su crediti riconosciuti da precedente esperienza al Politecnico di Torino. 
          Esami superati in fondamenti di informatica, programmazione orientata agli oggetti, basi 
          di dati, reti, fondamenti di machine learning ed economia.

        end_date: present
        location: Torino
        summary: Partecipo all'evoluzione della sanità digitale regionale
          integrando indirizzi strategici, conformità normativa e 
          implementazione di tecnologie emergenti.
        highlights:
          - "**Governance delle infrastrutture digitali**: Valutazione su
            deliverable tecnici in ambito di e-Health, con individuazione di 
            criticità in materia di cybersecurity e GDPR, proponendo poi un 
            framework di mitigazione. Contributo alla redazione di atti 
            tecnico-amministrativi regionali."
          - "**Innovazione e supporto in ambito sanitario**: Facilitazione dei
            tavoli tecnici per la progettazione di nuove soluzioni digitali
            e gestione di programmi pilota di AI per i medici, con coordinamento 
            di formazione e adozione."
          - "**Monitoraggio strategico e interoperabilità**: Coordinamento di
            iniziative inter-istituzionali per l'interoperabilità dei dati tra
            livello nazionale e regionale, con monitoraggio delle milestone
            PNRR - Missione 6 relative agli investimenti in sanità digitale."
      - company: Comune di Santa Vittoria d'Alba

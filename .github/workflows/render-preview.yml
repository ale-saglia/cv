name: Render Preview

on:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  render:
    name: Render sanitized preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip sync requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Render all CV YAMLs (sanitized)
        run: python scripts/render.py --preview

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-previews
          path: src/*/rendercv_output/CV_*_*.pdf
          retention-days: 30

name: Render Preview

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  render:
    name: Render (no secrets)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install "rendercv[full]==2.7" pyyaml==6.0.3 --quiet

      - name: Render all CV YAMLs (dry-run)
        run: |
          set -euo pipefail

          mapfile -t yaml_files < <(find src -mindepth 2 -maxdepth 2 -type f \( -name "*.yaml" -o -name "*.yml" \) \
            ! -name "*.enc.*" \
            ! -name "locale.yaml" \
            ! -path "*/rendercv_output/*" | sort)

          if [ ${#yaml_files[@]} -eq 0 ]; then
            echo "Nessun file YAML trovato sotto src/."
            exit 1
          fi

          for yaml_file in "${yaml_files[@]}"; do
            lang="$(basename "$(dirname "$yaml_file")")"
            cv_type="$(basename "$yaml_file")"
            cv_type="${cv_type%.yaml}"
            cv_type="${cv_type%.yml}"

            out_dir="$(dirname "$yaml_file")/rendercv_output"
            mkdir -p "$out_dir"
            rm -f "$out_dir"/*.pdf "$out_dir"/*.png "$out_dir"/*.md "$out_dir"/*.html "$out_dir"/*.typ || true

            echo "Render dry-run: $yaml_file"
            python scripts/injector.py --dry-run render "$yaml_file"

            mapfile -t generated_pdfs < <(find "$out_dir" -maxdepth 1 -type f -name "*.pdf" | sort)
            if [ ${#generated_pdfs[@]} -ne 1 ]; then
              echo "Atteso 1 PDF in $out_dir, trovati ${#generated_pdfs[@]}"
              exit 1
            fi

            latest_pdf="${generated_pdfs[0]}"
            target_pdf="$out_dir/CV_${lang}_${cv_type}.pdf"

            mv "$latest_pdf" "$target_pdf"
            echo "Creato: $target_pdf"
          done

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-previews
          path: src/*/rendercv_output/CV_*_*.pdf
          retention-days: 30

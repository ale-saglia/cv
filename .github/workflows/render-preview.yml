name: Render Preview

on:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  render:
    name: Render sanitized preview
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Render all CV YAMLs (sanitized)
        run: python scripts/build_pages_site.py --preview

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-previews
          path: src/*/rendercv_output/CV_*_*.pdf
          retention-days: 30

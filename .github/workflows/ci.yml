name: CI

on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install ruff pyyaml --quiet

      - name: Lint Python (ruff)
        run: ruff check scripts/

      - name: Validate YAML syntax
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path
          import yaml

          files = []
          files.extend(Path("src").rglob("*.yaml"))
          files.extend(Path("src").rglob("*.yml"))
          files.extend(Path(".github/workflows").glob("*.yml"))

          sops_config = Path(".sops.yaml")
          if sops_config.exists():
            files.append(sops_config)

          # Exclude encrypted files (not valid plain YAML)
          files = sorted({f for f in files if ".enc." not in f.name})

          errors = []
          for path in files:
              try:
                  with path.open(encoding="utf-8") as fh:
                      yaml.safe_load(fh)
                  print(f"  OK  {path}")
              except yaml.YAMLError as exc:
                  print(f"  FAIL {path}: {exc}")
                  errors.append(path)

          if errors:
              print(f"\n{len(errors)} file(s) with YAML errors.")
              sys.exit(1)
          else:
              print(f"\nAll {len(files)} YAML file(s) are valid.")
          EOF
